[project]
name = "codeatlas"
version = "0.1.0"
description = "本地代码知识库 RAG:语义问答 / 结构查询 / wiki 生成 / OceanBase 索引体检"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tree-sitter>=0.24",
    # language-pack 1.x switched to on-demand grammar downloads; 0.x bundles them
    "tree-sitter-language-pack>=0.7,<1.0",
    "sqlglot>=25.0",
    # lancedb >= 0.26 dropped macOS x86_64 wheels; 0.25.3 is the last Intel-mac build
    "lancedb>=0.15,<0.26",
    "pymysql>=1.1",
    "pathspec>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
atlas = "codeatlas.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeatlas"]

# 包内非 .py 资源:wiki prompts 与配置模板
[tool.hatch.build]
artifacts = [
    "src/codeatlas/gencode/prompts/*.md",
    "src/codeatlas/templates/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
